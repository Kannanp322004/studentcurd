<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Header -->
    <header class="header">

        <h1>🎓 Student Management System</h1>

        <p>Department Management Portal</p>

    </header>

    <!-- Dashboard -->
    <section class="dashboard">

        <div class="card">

            <h2 id="totalDepartments">0</h2>

            <p>Total Departments</p>

        </div>

        <div class="card">

            <h2 id="totalStudents">0</h2>

            <p>Total Students</p>

        </div>

    </section>

    <!-- Department Section -->
    <section class="department-container">

        <div class="top-bar">

            <h2>Departments</h2>

            <button id="addDepartmentBtn">
                + Add Department
            </button>

        </div>

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Department</th>

                    <th>Students</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="departmentTable">

                <!-- Data from JavaScript -->

            </tbody>

        </table>

    </section>

    <!-- Add Department Modal -->

    <div id="departmentModal" class="modal">

        <div class="modal-content">

            <h2>Add Department</h2>

            <input
                type="text"
                id="departmentName"
                placeholder="Department Name">

            <input
                type="password"
                id="departmentPassword"
                placeholder="Password">

            <button id="saveDepartment">
                Save Department
            </button>

            <button id="closeModal">
                Cancel
            </button>

        </div>

    </div>

    <!-- Login Modal -->

    <div id="loginModal" class="modal">

        <div class="modal-content">

            <h2 id="loginDepartmentTitle">
                Department Login
            </h2>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter Password">

            <button id="loginButton">
                Login
            </button>

            <button id="closeLogin">
                Cancel
            </button>

        </div>

    </div>

    <script src="home.js"></script>

</body>

</html>
